# Tag-driven releases: push a `v*` tag to build all six targets and publish a
# GitHub Release with the binaries plus a sha256 manifest.json that mStream
# vendors for its pinned-version download.
#
# Adapted from mStream's build-rust-server-audio.yml — same target matrix and
# cross setup, but artifacts go to a Release instead of being committed back
# into the repo.
#
# Every Linux build goes through cross, x64 included: the containers bring
# their own target-arch ALSA headers (Cross.toml), and the container's glibc
# — 2.31, old enough for the NAS and Pi installs mStream actually runs on —
# is a floor that does not move when ubuntu-latest does.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: mstream-player-win32-x64.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-x64
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-arm64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-x64
            use_cross: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/mstream-player"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate sha256 manifest
        shell: bash
        run: |
          cd dist
          chmod +x mstream-player-*
          version="${GITHUB_REF_NAME#v}"
          {
            echo '{'
            echo "  \"name\": \"mstream-player\","
            echo "  \"version\": \"${version}\","
            echo '  "apiVersion": 1,'
            echo '  "assets": ['
            first=true
            for f in mstream-player-*; do
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              $first || echo ','
              first=false
              printf '    {"file": "%s", "sha256": "%s"}' "$f" "$sum"
            done
            echo ''
            echo '  ]'
            echo '}'
          } > manifest.json
          cat manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
