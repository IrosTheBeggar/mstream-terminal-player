# Tag-driven releases: push a `v*` tag to build all six native targets plus
# the browser bundle, and publish a GitHub Release with the binaries, the web
# tarball, and a sha256 manifest.json that mStream vendors for its
# pinned-version download.
#
# Adapted from mStream's build-rust-server-audio.yml — same target matrix and
# cross setup, but artifacts go to a Release instead of being committed back
# into the repo.
#
# Every Linux build goes through cross, x64 included: the containers bring
# their own target-arch ALSA headers (Cross.toml), and the container's glibc
# — 2.31, old enough for the NAS and Pi installs mStream actually runs on —
# is a floor that does not move when ubuntu-latest does.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: mstream-player-win32-x64.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-x64
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-arm64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-x64
            use_cross: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Developer ID signing + notarization, only where the secrets exist:
      # a fork or a dry run still builds, just unsigned. Bare Mach-O
      # binaries cannot be stapled, so the notarization ticket lives on
      # Apple's servers and Gatekeeper checks it online — the normal
      # arrangement for CLI tools. Runs before staging so the manifest
      # hashes cover the signed bytes.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The secrets context is not allowed in a step-level `if`, so the
          # gate lives here: absent secrets mean an unsigned build, not a
          # failed one.
          if [ -z "${CERT_P12}" ]; then
            echo "signing secrets absent — shipping unsigned"
            exit 0
          fi
          bin="target/${{ matrix.target }}/release/mstream-player"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          codesign --force --timestamp --options runtime \
            --identifier io.mstream.player --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # The signing key's job is done: notarytool below submits the
          # already-signed binary with API-key auth and needs no keychain.
          # Take it out of the search list and delete it now rather than
          # leaving an unlocked, codesign-authorized Developer ID keychain on
          # the runner for the rest of the job (the `if: always()` step below
          # covers a failure that exits this script before this line).
          security list-keychains -d user -s login.keychain
          security delete-keychain "$keychain"
          echo "signing keychain removed"

          echo "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k "$bin" "$RUNNER_TEMP/notarize.zip"
          # Team keys carry an issuer UUID; individual keys must not pass
          # --issuer at all, says notarytool itself.
          issuer=()
          if [ -n "${ASC_ISSUER_ID}" ]; then
            issuer=(--issuer "$ASC_ISSUER_ID")
          fi
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
            "${issuer[@]}" --wait --timeout 15m
          rm "$RUNNER_TEMP/asc.p8"

      # If the sign step failed between creating the keychain and its own
      # removal (a codesign or verify failure), the keychain must still not
      # outlive the step. Idempotent: an already-deleted keychain is simply
      # not there; an unsigned build never created one.
      - name: Remove signing keychain (always)
        if: always() && runner.os == 'macOS'
        run: |
          security list-keychains -d user -s login.keychain 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" && echo "signing keychain removed (cleanup step)"
          else
            echo "no signing keychain present (already removed, or this build shipped unsigned)"
          fi

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/mstream-player"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          retention-days: 1

  # The seventh artifact: the same player built for a tab (see src/web),
  # tarred as a static bundle. It rides the same manifest — the asset name
  # matches the `mstream-player*` glob below, so the sha256 entry is free —
  # and mStream serves it same-origin next to the /api routes it calls,
  # which is why no host or proxy configuration ships inside it.
  web:
    name: Build mstream-player-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-release

      # Pinned, not latest: index.html's data-wasm-opt-params needs >= 0.21,
      # and trunk fetches its own wasm-bindgen and wasm-opt at build time.
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"

      # --public-url ./ keeps every asset link relative, so the bundle
      # serves from /, /player/, or wherever a host mounts it — no rebuild
      # per mount point.
      - name: Build web bundle
        run: |
          trunk build --release --public-url ./
          tar czf mstream-player-web.tar.gz -C dist .

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: mstream-player-web.tar.gz
          path: mstream-player-web.tar.gz
          retention-days: 1

  release:
    name: Publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      # The packaging tools read Cargo.toml and ship the README, so this
      # job checks the repo out even though it compiles nothing.
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # Native packages wrap the binaries that were just downloaded — no
      # compilation. Their real value over the bare binary is the dependency
      # line: apt and dnf bring ALSA along instead of the README explaining
      # it. armv7 gets a deb only; Fedora retired 32-bit arm.
      - name: Package deb and rpm
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package() {
            asset="$1"; debarch="$2"; rpmarch="$3"; triple="$4"
            mkdir -p "target/${triple}/release"
            install -m 755 "dist/${asset}" "target/${triple}/release/mstream-player"
            cargo deb --no-build --no-strip --target "${triple}" \
              -o "dist/mstream-player_${version}_${debarch}.deb"
            if [ -n "${rpmarch}" ]; then
              cargo generate-rpm --arch "${rpmarch}" --target "${triple}" \
                --target-dir target \
                -o "dist/mstream-player-${version}.${rpmarch}.rpm"
            fi
          }
          package mstream-player-linux-x64 amd64 x86_64 x86_64-unknown-linux-gnu
          package mstream-player-linux-arm64 arm64 aarch64 aarch64-unknown-linux-gnu
          package mstream-player-linux-arm armhf "" armv7-unknown-linux-gnueabihf

      - name: Generate sha256 manifest
        shell: bash
        run: |
          cd dist
          chmod +x mstream-player-linux-* mstream-player-darwin-* mstream-player-win32-*
          version="${GITHUB_REF_NAME#v}"
          {
            echo '{'
            echo "  \"name\": \"mstream-player\","
            echo "  \"version\": \"${version}\","
            echo '  "apiVersion": 1,'
            echo '  "assets": ['
            first=true
            for f in mstream-player*; do
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              $first || echo ','
              first=false
              printf '    {"file": "%s", "sha256": "%s"}' "$f" "$sum"
            done
            echo ''
            echo '  ]'
            echo '}'
          } > manifest.json
          cat manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # In this same workflow rather than reacting to `release: published`,
  # because that event never fires here: the release is created with the
  # workflow's own GITHUB_TOKEN, and GITHUB_TOKEN events do not trigger
  # workflows. update-tap.yml remains as the hand-cranked fallback.
  channels:
    name: Update package channels
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: IrosTheBeggar/homebrew-mstream
            file: Formula/mstream-player.rb
          - channel: IrosTheBeggar/scoop-mstream
            file: bucket/mstream-player.json
    steps:
      - name: Check out ${{ matrix.channel }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.channel }}
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Regenerate ${{ matrix.file }}
        run: sh scripts/bump.sh "$GITHUB_REF_NAME"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.file }}"
          if git diff --cached --quiet; then
            echo "already at this version — nothing to push"
            exit 0
          fi
          git commit -m "mstream-player $GITHUB_REF_NAME"
          git push
