# Tag-driven releases: push a `v*` tag to build all six native targets of
# the terminal player, the desktop family beside them, and the browser
# bundle, and publish a GitHub Release with the binaries, the web tarball,
# and a sha256 manifest.json that mStream vendors for its pinned-version
# download.
#
# Two products from one tree (Cargo.toml's [features]). The terminal
# flavour (no features) is every asset that existed before the desktop
# family: the unsuffixed binaries, the deb/rpm, and what Homebrew, Scoop,
# install.sh/ps1 and cargo install fetch. The desktop flavour
# (`--features desktop`, the GUI in its own window when started with no
# arguments) ships as `mstream-player-desktop-*`: the bare binaries, named
# `-raw` so nobody downloads one by hand (they are for mStream's bundles and
# for scripts), and per-OS packages of them (package-desktop below).
#
# A tag with a hyphen (v0.10.0-rc.1) is a pre-release: the Release is
# marked so, never becomes "latest" (what install.sh and install.ps1 fetch
# by default), and neither the package channels nor mStream are told
# (channels and notify below skip it).
#
# Adapted from mStream's build-rust-server-audio.yml — same target matrix and
# cross setup, but artifacts go to a Release instead of being committed back
# into the repo. The steps of one leg live in build-binary.yml.
#
# Every Linux build goes through cross, x64 included: the containers bring
# their own target-arch ALSA headers (Cross.toml), and the container's glibc
# — 2.31, old enough for the NAS and Pi installs mStream actually runs on —
# is a floor that does not move when ubuntu-latest does.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The terminal flavour: these six names are what install.sh, install.ps1,
  # the channel bump scripts and mStream's updater ask for by exact name.
  build:
    name: ${{ matrix.binary_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: mstream-player-win32-x64.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-x64
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-darwin-arm64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-x64
            use_cross: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: mstream-player-linux-arm
            use_cross: true
    uses: ./.github/workflows/build-binary.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      binary_name: ${{ matrix.binary_name }}
      use_cross: ${{ matrix.use_cross }}
    secrets: inherit

  # The desktop flavour, for the machines that have a desktop: no arm64 or
  # armv7 Linux, whose installs are the headless NAS and Pi boxes.
  #
  # The hold-back: a pre-release tag always builds it, so a release
  # candidate is where the desktop assets get tried; a stable tag builds it
  # only once the repository variable DESKTOP_RELEASES is 'true', so the
  # first stable tag after this lands does not ship untested desktop assets.
  # The owner sets the variable (Settings > Secrets and variables > Actions >
  # Variables) once the desktop gates in PLAN.md (Phase 14) pass. A
  # workflow_dispatch from a branch is not a tag and publishes nothing, so
  # it builds both families as a dry run.
  build-desktop:
    name: ${{ matrix.binary_name }}
    if: >-
      ${{ !startsWith(github.ref, 'refs/tags/v')
          || contains(github.ref_name, '-')
          || vars.DESKTOP_RELEASES == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: mstream-player-desktop-win32-x64-raw.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-desktop-darwin-x64-raw
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: mstream-player-desktop-darwin-arm64-raw
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: mstream-player-desktop-linux-x64-raw
            use_cross: true
    uses: ./.github/workflows/build-binary.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      binary_name: ${{ matrix.binary_name }}
      use_cross: ${{ matrix.use_cross }}
      features: desktop
    secrets: inherit

  # The desktop packages: each desktop binary wrapped the way its OS
  # installs an app, beside the bare binaries (which mStream's bundles
  # fetch, and which stay as they are):
  # - mstream-player-desktop-darwin-{arm64,x64}.app.zip: "mStream Player.app",
  #   bundle id io.mstream.player, signed, notarized and stapled when the
  #   signing secrets exist (a dmg may come later);
  # - mstream-player-desktop-win32-x64.zip: portable, the launcher stub as
  #   "mStream Player.exe" beside the player; unsigned (no certificate yet,
  #   which its README.txt says);
  # - mstream-player-desktop-linux-x64.tar.gz: the binary, the desktop entry
  #   and the hicolor icons, with a per-user install in its README.txt.
  # The layouts are scripts/package-{macos.sh,windows.py,linux.sh}, so the
  # same code runs on a dev Mac and here; this job only fetches, signs and
  # uploads. Held back with build-desktop: a skipped build skips this.
  #
  # The version is the tag's, less the v. A workflow_dispatch from a branch
  # has no tag (GITHUB_REF_NAME is the branch, slashes and all), and is the
  # dry run of this very job, so it takes Cargo.toml's version instead of
  # failing: the number the binary inside reports with --version, so the
  # bundle and its executable agree, and a valid CFBundleShortVersionString
  # whatever the branch is called. No file name carries the version, and a
  # dry run publishes nothing, so it collides with no release.
  package-desktop:
    name: Package ${{ matrix.package }}
    needs: build-desktop
    if: needs.build-desktop.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mstream-player-desktop-darwin-arm64.app.zip
            kind: macos
            binary: mstream-player-desktop-darwin-arm64-raw
            runner: macos-latest

          - package: mstream-player-desktop-darwin-x64.app.zip
            kind: macos
            binary: mstream-player-desktop-darwin-x64-raw
            runner: macos-latest

          # A zip needs no Windows runner; the build-desktop leg's artifact
          # carries the stub beside the player (build-binary.yml).
          - package: mstream-player-desktop-win32-x64.zip
            kind: windows
            binary: mstream-player-desktop-win32-x64-raw.exe
            runner: ubuntu-latest

          - package: mstream-player-desktop-linux-x64.tar.gz
            kind: linux
            binary: mstream-player-desktop-linux-x64-raw
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download the desktop binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: in

      # SOURCE_DATE_EPOCH (the commit's time) is the zip's and the
      # tarball's one timestamp, so a rerun of the same commit packs the
      # same bytes.
      - name: Version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          fi
          if [ -z "$version" ]; then
            echo "::error::no version from ${GITHUB_REF} or Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "packaging ${{ matrix.package }} as version $version"

      - name: Assemble the .app (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package-macos.sh "in/${{ matrix.binary }}" \
            assets/icons/io.mstream.player.icns "$VERSION" work

      - name: Import signing certificate (macOS)
        id: signing
        if: matrix.kind == 'macos'
        uses: ./.github/actions/macos-signing
        with:
          cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      # Inside-out, though there is little inside: the bundle's one piece of
      # code is its executable, which build-binary.yml already signed with
      # this identity and the identifier io.mstream.player. Signing the
      # bundle re-signs that executable as the bundle's main code, so its
      # signature now seals Info.plist and the resources too, under the same
      # identifier (CFBundleIdentifier). No --deep: it would re-sign nested
      # code with the outer options, which Apple advises against, and
      # nothing is nested here.
      #
      # A bare Mach-O cannot hold a stapled ticket; a bundle can, so the
      # .app is notarized as a zip, stapled, and zipped again: Gatekeeper
      # then accepts it offline on first launch.
      - name: Sign, notarize, staple and zip (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          app="work/mStream Player.app"
          mkdir -p out
          if [ -z "${IDENTITY}" ]; then
            ditto -c -k --keepParent "$app" "out/$PACKAGE"
            echo "- \`$PACKAGE\`: **unsigned** (signing secrets absent)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Runtime)'

          # The key's job is done; drop the keychain now, as build-binary.yml
          # does (the always() step below covers an earlier failure).
          security list-keychains -d user -s login.keychain
          security delete-keychain "$KEYCHAIN"
          echo "signing keychain removed"

          # Signed but not yet notarized, Gatekeeper rejects it
          # ("source=Unnotarized Developer ID"): printed for the log only.
          spctl -a -t exec -vv "$app" || true

          echo "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          issuer=()
          if [ -n "${ASC_ISSUER_ID}" ]; then
            issuer=(--issuer "$ASC_ISSUER_ID")
          fi
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
            ${issuer[@]+"${issuer[@]}"} --wait --timeout 15m
          rm "$RUNNER_TEMP/asc.p8"

          # stapler fails when Apple issued no ticket, which also catches a
          # submission that came back Invalid with notarytool exiting 0.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app"

          ditto -c -k --keepParent "$app" "out/$PACKAGE"
          echo "- \`$PACKAGE\`: signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain (always)
        if: always() && matrix.kind == 'macos'
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" && echo "signing keychain removed (cleanup step)"
          else
            echo "no signing keychain present (already removed, or this package shipped unsigned)"
          fi

      - name: Zip (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          python3 scripts/package-windows.py \
            "in/${{ matrix.binary }}" \
            "in/mstream-player-desktop-launch-win32-x64-raw.exe" \
            assets/mstream-logo.ico "out/${{ matrix.package }}"
          echo "- \`${{ matrix.package }}\`: **unsigned** (no Windows code-signing certificate yet)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tar (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          bash scripts/package-linux.sh "in/${{ matrix.binary }}" assets "out/${{ matrix.package }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: out/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 1

  # The seventh artifact: the same player built for a tab (see src/web),
  # tarred as a static bundle. It rides the same manifest — the asset name
  # matches the `mstream-player*` glob below, so the sha256 entry is free —
  # and mStream serves it same-origin next to the /api routes it calls,
  # which is why no host or proxy configuration ships inside it.
  web:
    name: Build mstream-player-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-release

      # Pinned, not latest: index.html's data-wasm-opt-params needs >= 0.21,
      # and trunk fetches its own wasm-bindgen and wasm-opt at build time.
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"

      # --public-url ./ keeps every asset link relative, so the bundle
      # serves from /, /player/, or wherever a host mounts it — no rebuild
      # per mount point.
      - name: Build web bundle
        run: |
          trunk build --release --public-url ./
          tar czf mstream-player-web.tar.gz -C dist .

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: mstream-player-web.tar.gz
          path: mstream-player-web.tar.gz
          retention-days: 1

  # A skipped need would skip this job too, the hold-back's skipped
  # build-desktop included, unless the `if` says otherwise; so it does:
  # every terminal leg and the web bundle must have succeeded, and the
  # desktop family either went through whole (binaries and packages) or
  # was held back whole (both skipped). A failed desktop leg or package
  # stops the release, as any failed leg always has; so does the pair
  # disagreeing, which only a failure can cause.
  release:
    name: Publish release
    needs: [build, build-desktop, package-desktop, web]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.web.result == 'success'
          && ((needs.build-desktop.result == 'success'
               && needs.package-desktop.result == 'success')
              || (needs.build-desktop.result == 'skipped'
                  && needs.package-desktop.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      # The packaging tools read Cargo.toml and ship the README, so this
      # job checks the repo out even though it compiles nothing.
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # Native packages wrap the binaries that were just downloaded — no
      # compilation. Their real value over the bare binary is the dependency
      # line: apt and dnf bring ALSA along instead of the README explaining
      # it. armv7 gets a deb only; Fedora retired 32-bit arm. They wrap the
      # terminal flavour only, named below by its exact asset names; the
      # desktop binaries sit beside them in dist/ untouched.
      - name: Package deb and rpm
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package() {
            asset="$1"; debarch="$2"; rpmarch="$3"; triple="$4"
            mkdir -p "target/${triple}/release"
            install -m 755 "dist/${asset}" "target/${triple}/release/mstream-player"
            cargo deb --no-build --no-strip --target "${triple}" \
              -o "dist/mstream-player_${version}_${debarch}.deb"
            if [ -n "${rpmarch}" ]; then
              cargo generate-rpm --arch "${rpmarch}" --target "${triple}" \
                --target-dir target \
                -o "dist/mstream-player-${version}.${rpmarch}.rpm"
            fi
          }
          package mstream-player-linux-x64 amd64 x86_64 x86_64-unknown-linux-gnu
          package mstream-player-linux-arm64 arm64 aarch64 aarch64-unknown-linux-gnu
          package mstream-player-linux-arm armhf "" armv7-unknown-linux-gnueabihf

      - name: Generate sha256 manifest
        shell: bash
        run: |
          cd dist
          # The Windows launcher stub rides the desktop artifact only to reach
          # the zip; alone it is nothing to publish or to pin.
          rm -f mstream-player-desktop-launch-win32-x64-raw.exe
          chmod +x mstream-player-linux-* mstream-player-darwin-* mstream-player-win32-*
          # The desktop family may be held back (build-desktop skipped), and an
          # unmatched glob would hand chmod its literal pattern; hence the test.
          # Its packages share the prefix and are not programs: they keep
          # their modes (the executables inside carry their own).
          for f in mstream-player-desktop-*; do
            case "$f" in *.zip|*.tar.gz) continue ;; esac
            if [ -e "$f" ]; then chmod +x "$f"; fi
          done
          # Only the leading v goes: a pre-release tag yields "0.10.0-rc.1",
          # which is what its GitHub Release is called anyway. Consumers go by
          # exact file names, not by this list's shape (install.sh's grep for
          # its one asset, the Homebrew and Scoop bump.sh scripts, mStream's
          # updater), so the desktop entries are additive and apiVersion stays 1.
          version="${GITHUB_REF_NAME#v}"
          {
            echo '{'
            echo "  \"name\": \"mstream-player\","
            echo "  \"version\": \"${version}\","
            echo '  "apiVersion": 1,'
            echo '  "assets": ['
            first=true
            for f in mstream-player*; do
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              $first || echo ','
              first=false
              printf '    {"file": "%s", "sha256": "%s"}' "$f" "$sum"
            done
            echo ''
            echo '  ]'
            echo '}'
          } > manifest.json
          cat manifest.json

      # A hyphen in the tag (v0.10.0-rc.1) marks a pre-release, which GitHub
      # never serves as releases/latest; make_latest says the same thing for
      # stable tags outright rather than leaving it to the API's default.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # In this same workflow rather than reacting to `release: published`,
  # because that event never fires here: the release is created with the
  # workflow's own GITHUB_TOKEN, and GITHUB_TOKEN events do not trigger
  # workflows. update-tap.yml remains as the hand-cranked fallback.
  #
  # Stable tags only: a pre-release must not become what `brew upgrade` and
  # `scoop update` install. The status checks are spelled out because a
  # skip carries down the whole dependency chain, not only to the jobs that
  # name the skipped one (GitHub's `needs` docs; actions/runner#491): left
  # to the implicit success(), this would be skipped whenever the hold-back
  # skipped build-desktop, even with `release` green.
  channels:
    name: Update package channels
    needs: release
    if: >-
      ${{ !cancelled()
          && needs.release.result == 'success'
          && startsWith(github.ref, 'refs/tags/v')
          && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: IrosTheBeggar/homebrew-mstream
            file: Formula/mstream-player.rb
          - channel: IrosTheBeggar/scoop-mstream
            file: bucket/mstream-player.json
    steps:
      - name: Check out ${{ matrix.channel }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.channel }}
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Regenerate ${{ matrix.file }}
        run: sh scripts/bump.sh "$GITHUB_REF_NAME"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.file }}"
          if git diff --cached --quiet; then
            echo "already at this version — nothing to push"
            exit 0
          fi
          git commit -m "mstream-player $GITHUB_REF_NAME"
          git push

  # Beside channels, and here for the same reason: mStream's repository_dispatch
  # cannot hang off `release: published`, because the Release above is created
  # with the workflow's own GITHUB_TOKEN and that event never fires here
  # (notify-mstream.yml listened for it from 2026-08-20 and ran zero times;
  # every pin bump so far was done by hand on the mStream side — the updater
  # script run locally through v0.5.0, a workflow_dispatch of
  # update-mstream-player-manifest from v0.6.0 on).
  # notify-mstream.yml remains as the hand-cranked fallback.
  #
  # Stable tags only: a pre-release is not an adoption candidate, and mStream's
  # manifest updater refuses pre-release tags on its own. The status is spelled
  # out as in channels (actions/runner#491). An expired MSTREAM_REPO_TOKEN shows
  # as a red job on a published release rather than as silence.
  notify:
    name: Notify mStream
    needs: release
    if: >-
      ${{ !cancelled()
          && needs.release.result == 'success'
          && startsWith(github.ref, 'refs/tags/v')
          && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # The dispatch goes out with the PAT; GITHUB_TOKEN only reads the script.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Fire player-release dispatch
        env:
          TOKEN: ${{ secrets.MSTREAM_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: sh scripts/notify-mstream.sh

  # mstream.io's desktop downloads: stamp this release's tag into the site's
  # src/data/release.json and push to the site's master, which deploys it
  # (scripts/update-website.sh). Beside channels and notify, and here for
  # the same reason; update-website.yml is the hand-cranked fallback.
  #
  # Stable tags whose desktop packages were built: the site links those
  # packages by name under the stamped tag, so a release that held the
  # desktop family back leaves the site on the last one that had them (the
  # script checks the files on the release too). The status is spelled out
  # as in channels (actions/runner#491). The push goes out with WEBSITE_KEY,
  # the private half of a write deploy key on IrosTheBeggar/mstream-website
  # (the mStream repo's own stamp holds one too). Missing, it warns and skips,
  # as a missing token does in notify — a secret never set must not fail a
  # published release; refused, the job goes red.
  website:
    name: Update mstream.io
    needs: [release, package-desktop]
    if: >-
      ${{ !cancelled()
          && needs.release.result == 'success'
          && needs.package-desktop.result == 'success'
          && startsWith(github.ref, 'refs/tags/v')
          && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # The push goes out with the deploy key; GITHUB_TOKEN only reads this
    # repo's release and the script.
    permissions:
      contents: read
    steps:
      - name: Check for WEBSITE_KEY
        id: key
        env:
          WEBSITE_KEY: ${{ secrets.WEBSITE_KEY }}
        run: |
          if [ -n "$WEBSITE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::WEBSITE_KEY is not set — mstream.io was not updated; run update-website.yml by hand for $GITHUB_REF_NAME"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'

      - name: Check out mstream-website
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          repository: IrosTheBeggar/mstream-website
          ref: master
          path: website
          ssh-key: ${{ secrets.WEBSITE_KEY }}

      - name: Stamp release.json and push
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SITE_DIR: website
        run: sh scripts/update-website.sh
