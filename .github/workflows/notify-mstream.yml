# The hand-cranked mStream notice: fire the player-release dispatch for a
# given tag. The automatic path is the `notify` job inside release.yml — it
# cannot live here behind GitHub's published-release event, because our
# releases are created with the workflow's own GITHUB_TOKEN, and GITHUB_TOKEN
# events (other than workflow_dispatch and repository_dispatch) never trigger
# workflows; this file listened for that event from 2026-08-20 and ran zero
# times. This stays for re-runs and repairs, and for proving the token: the
# tag mStream currently pins makes its workflow answer "pins already
# current — nothing to do", which is the harmless end-to-end proof (an
# older tag would open a downgrade PR there).
#
# Needs MSTREAM_REPO_TOKEN: a fine-grained PAT — Repository access:
# IrosTheBeggar/mStream only; Permissions: Contents: Read and write.
name: Notify mStream (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to tell mStream about, e.g. v0.11.0"
        required: true

# The dispatch goes out with the PAT; GITHUB_TOKEN only reads the script.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fire player-release dispatch
        env:
          TOKEN: ${{ secrets.MSTREAM_REPO_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: sh scripts/notify-mstream.sh
