# One release binary: build, guard, sign, stage, upload. Called by release.yml
# twice over — once per leg of the terminal matrix (`build`) and once per leg
# of the desktop matrix (`build-desktop`) — so the steps exist once and the two
# flavours cannot drift apart. It is a reusable workflow rather than a second
# copy of the job because the desktop legs must be skippable as a group (the
# hold-back in release.yml): a matrix entry cannot be skipped on its own, a job
# can.
#
# The checkout, the github context and the secrets (passed with
# `secrets: inherit`) are the caller's, so this builds exactly the tagged
# commit and signs with the same Developer ID as before.

name: Build release binary

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple"
        required: true
        type: string
      runner:
        description: "runs-on label"
        required: true
        type: string
      binary_name:
        description: "The release asset's file name"
        required: true
        type: string
      use_cross:
        description: "Build in a cross container (every Linux leg; see release.yml)"
        required: true
        type: boolean
      features:
        description: "Cargo features, empty for the terminal flavour"
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      # The flavour is part of the key: both flavours build the same target
      # here under the same job id, so one key would let the last leg to
      # finish overwrite the other's cache with a target dir built for the
      # other feature set. The terminal key is the bare triple, as it was
      # before the desktop family existed, so its caches carry over.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: >-
            ${{ inputs.target }}${{ inputs.features != ''
                && format('-{0}', inputs.features) || '' }}

      - name: Install cross
        if: inputs.use_cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"

      - name: Build
        shell: bash
        # 64 MiB stacks for rustc's threads (the default is 8 MiB). The
        # v0.6.0 tag build died on darwin-x64 with `rustc interrupted by
        # SIGBUS` — a stack overflow inside an LLVM machine pass
        # (MachineLateInstrsCleanup recursing over one very large function
        # of this crate) while cross-compiling x86_64-apple-darwin on the
        # arm64 runner with rustc 1.98.1; the other five targets built. The
        # compiler's own advice for this crash class is a larger
        # RUST_MIN_STACK, and the legs that never needed it take no harm.
        # (`cross` runs cargo in a container and does not pass this
        # through — those legs were never the problem.)
        #
        # FEATURES goes through the environment, not into the script text.
        # Empty, `${FEATURES:+...}` expands to no words at all, so a terminal
        # leg runs the very command it always has.
        env:
          RUST_MIN_STACK: 67108864
          FEATURES: ${{ inputs.features }}
        run: |
          if [ "${{ inputs.use_cross }}" = "true" ]; then
            cross build --release --target ${{ inputs.target }} ${FEATURES:+--features "$FEATURES"}
          else
            cargo build --release --target ${{ inputs.target }} ${FEATURES:+--features "$FEATURES"}
          fi

      # CI runs the same guard on its native builds; this is the one that
      # sees the binaries that ship, arm64 and armv7 included. The desktop
      # flavour is held to it unchanged: winit and wgpu open their libraries
      # at run time, so its NEEDED list must be as clean as the terminal one.
      - name: Linkage guard (Linux)
        if: runner.os == 'Linux'
        run: sh test/linkage.sh target/${{ inputs.target }}/release/mstream-player

      # Developer ID signing + notarization, only where the secrets exist:
      # a fork or a dry run still builds, just unsigned. Bare Mach-O
      # binaries cannot be stapled, so the notarization ticket lives on
      # Apple's servers and Gatekeeper checks it online — the normal
      # arrangement for CLI tools. Runs before staging so the manifest
      # hashes cover the signed bytes. Both flavours sign with the same
      # identifier: they are one program, built two ways.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The secrets context is not allowed in a step-level `if`, so the
          # gate lives here: absent secrets mean an unsigned build, not a
          # failed one.
          if [ -z "${CERT_P12}" ]; then
            echo "signing secrets absent — shipping unsigned"
            exit 0
          fi
          bin="target/${{ inputs.target }}/release/mstream-player"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          codesign --force --timestamp --options runtime \
            --identifier io.mstream.player --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # The signing key's job is done: notarytool below submits the
          # already-signed binary with API-key auth and needs no keychain.
          # Take it out of the search list and delete it now rather than
          # leaving an unlocked, codesign-authorized Developer ID keychain on
          # the runner for the rest of the job (the `if: always()` step below
          # covers a failure that exits this script before this line).
          security list-keychains -d user -s login.keychain
          security delete-keychain "$keychain"
          echo "signing keychain removed"

          echo "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k "$bin" "$RUNNER_TEMP/notarize.zip"
          # Team keys carry an issuer UUID; individual keys must not pass
          # --issuer at all, says notarytool itself.
          issuer=()
          if [ -n "${ASC_ISSUER_ID}" ]; then
            issuer=(--issuer "$ASC_ISSUER_ID")
          fi
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
            "${issuer[@]}" --wait --timeout 15m
          rm "$RUNNER_TEMP/asc.p8"

      # If the sign step failed between creating the keychain and its own
      # removal (a codesign or verify failure), the keychain must still not
      # outlive the step. Idempotent: an already-deleted keychain is simply
      # not there; an unsigned build never created one.
      - name: Remove signing keychain (always)
        if: always() && runner.os == 'macOS'
        run: |
          security list-keychains -d user -s login.keychain 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" && echo "signing keychain removed (cleanup step)"
          else
            echo "no signing keychain present (already removed, or this build shipped unsigned)"
          fi

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ inputs.target }}/release/mstream-player"
          if [[ "${{ inputs.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ inputs.binary_name }}"

      # Artifact names are unique per run, which the two families' distinct
      # asset names guarantee.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.binary_name }}
          path: staging/${{ inputs.binary_name }}
          retention-days: 1
