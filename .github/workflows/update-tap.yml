# After a release publishes, push the version-and-hashes bump to each
# package channel — the Homebrew tap and the Scoop bucket. Both carry a
# scripts/bump.sh that regenerates their file whole from this release's
# manifest.json, so the channels follow releases without hands.
#
# Needs TAP_PUSH_TOKEN: a fine-grained PAT with contents:write on
# IrosTheBeggar/homebrew-mstream and IrosTheBeggar/scoop-mstream only —
# GITHUB_TOKEN cannot push to sibling repos.
name: Update package channels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: IrosTheBeggar/homebrew-mstream
            file: Formula/mstream-player.rb
          - channel: IrosTheBeggar/scoop-mstream
            file: bucket/mstream-player.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ matrix.channel }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.channel }}
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Regenerate ${{ matrix.file }}
        run: sh scripts/bump.sh "${{ github.event.release.tag_name || inputs.tag }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.file }}"
          if git diff --cached --quiet; then
            echo "already at this version — nothing to push"
            exit 0
          fi
          git commit -m "mstream-player ${{ github.event.release.tag_name || inputs.tag }}"
          git push
