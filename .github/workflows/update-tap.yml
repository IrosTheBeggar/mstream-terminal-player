# The hand-cranked channel bump: regenerate the Homebrew formula and the
# Scoop manifest for a given tag. The automatic path is the `channels` job
# inside release.yml — it cannot live here behind `release: published`,
# because our releases are created with the workflow's own GITHUB_TOKEN
# and GITHUB_TOKEN events never trigger workflows. This stays for re-runs
# and repairs.
#
# Needs TAP_PUSH_TOKEN: a fine-grained PAT with contents:write on
# IrosTheBeggar/homebrew-mstream and IrosTheBeggar/scoop-mstream only —
# GITHUB_TOKEN cannot push to sibling repos.
name: Update package channels (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: IrosTheBeggar/homebrew-mstream
            file: Formula/mstream-player.rb
          - channel: IrosTheBeggar/scoop-mstream
            file: bucket/mstream-player.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ matrix.channel }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.channel }}
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Regenerate ${{ matrix.file }}
        run: sh scripts/bump.sh "${{ inputs.tag }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.file }}"
          if git diff --cached --quiet; then
            echo "already at this version — nothing to push"
            exit 0
          fi
          git commit -m "mstream-player ${{ inputs.tag }}"
          git push
