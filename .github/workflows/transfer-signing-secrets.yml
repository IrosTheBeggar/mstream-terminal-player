# ── ONE-SHOT: copy the five macOS signing secrets to another repo ──────────
#
# Why this exists: GitHub secrets are write-only (no read-back, ever), the
# original .p12/.p8 source files live on a different machine, and personal
# accounts have no org-style shared secrets. But a workflow CAN read its own
# repo's secrets — so this dispatches once, pushes the five values straight
# into the target repo's Actions secrets via `gh secret set`, and never
# writes them to disk, logs, or anywhere else. stdin-piped (never argv, never
# echoed); Actions additionally masks secret values in any log output.
#
# Setup (all on github.com, ~3 minutes):
#   1. Create a FINE-GRAINED PAT: Settings → Developer settings → Fine-grained
#      tokens → Generate new. Repository access: ONLY IrosTheBeggar/mStream
#      and IrosTheBeggar/mstream-terminal-player. Permissions → Repository →
#      Secrets: Read and write. Expiration: shortest available.
#   2. Store it (NOT as a dispatch input — this repo is public and dispatch
#      inputs are visible in the run's event payload):
#         gh secret set TRANSFER_PAT -R IrosTheBeggar/mstream-terminal-player
#   3. Dispatch:
#         gh workflow run transfer-signing-secrets.yml -R IrosTheBeggar/mstream-terminal-player
#
# The run ends by deleting TRANSFER_PAT from this repo (the PAT's
# terminal-player scope exists for exactly that). Afterwards: revoke the PAT
# and delete this file — it has no second use.
name: Transfer signing secrets (one-shot)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Repo to receive the five signing secrets'
        type: string
        default: 'IrosTheBeggar/mStream'

# The default GITHUB_TOKEN is not used at all (it cannot manage secrets);
# everything runs on the scoped PAT.
permissions: {}

jobs:
  transfer:
    # workflow_dispatch already requires write access on this repo; this is
    # the belt to that suspender on a public repo.
    if: github.actor == 'IrosTheBeggar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TRANSFER_PAT }}
      TARGET: ${{ inputs.target }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Copy the five secrets
        run: |
          set -euo pipefail
          # Fail up front, by name, if anything is absent — a half-transfer
          # would reproduce in the target repo the exact partial-secret-set
          # failure its signing workflow guards against.
          missing=""
          [ -n "$GH_TOKEN" ]             || missing="$missing TRANSFER_PAT"
          [ -n "$MACOS_CERT_P12" ]       || missing="$missing MACOS_CERT_P12"
          [ -n "$MACOS_CERT_PASSWORD" ]  || missing="$missing MACOS_CERT_PASSWORD"
          [ -n "$ASC_API_KEY" ]          || missing="$missing ASC_API_KEY"
          [ -n "$ASC_KEY_ID" ]           || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]        || missing="$missing ASC_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing in this repo:$missing"
            exit 1
          fi
          # printf '%s' + stdin: byte-identical transfer (no argv exposure,
          # no added trailing newline — MACOS_CERT_P12 stays valid base64 and
          # ASC_API_KEY stays a byte-exact .p8, the encodings the signing
          # workflows on both sides consume).
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_API_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            printf '%s' "${!name}" | gh secret set "$name" -R "$TARGET"
            echo "set: $name"
          done

      - name: Verify (names + timestamps only)
        run: gh secret list -R "$TARGET"

      - name: Self-clean TRANSFER_PAT from this repo
        if: always()
        run: gh secret delete TRANSFER_PAT -R "${{ github.repository }}" || echo "::warning::could not delete TRANSFER_PAT — remove it manually"
