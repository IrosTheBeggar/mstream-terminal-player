# The Developer ID certificate, imported into a throwaway keychain, and the
# identity codesign signs with. Shared by build-binary.yml (the bare
# binaries) and release.yml's package-desktop (the .app bundles), so the two
# cannot import it two different ways.
#
# A composite action cannot read the secrets context, so the caller passes
# the certificate in; an empty one is the unsigned build (a fork, or a
# repository without the secrets), which is not an error: `identity` comes
# back empty and the caller ships unsigned.
#
# The keychain is always $RUNNER_TEMP/signing.keychain-db: the callers
# delete it as soon as codesign is done, and their `if: always()` cleanup
# steps look for it at that path.

name: Import macOS signing certificate
description: Import the Developer ID certificate into a temporary keychain

inputs:
  cert-p12:
    description: "The certificate and key, a base64 .p12 (MACOS_CERT_P12)"
    required: false
    default: ''
  cert-password:
    description: "The .p12's password (MACOS_CERT_PASSWORD)"
    required: false
    default: ''

outputs:
  identity:
    description: "The Developer ID Application identity, empty when unsigned"
    value: ${{ steps.import.outputs.identity }}
  keychain:
    description: "The temporary keychain's path, empty when unsigned"
    value: ${{ steps.import.outputs.keychain }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        CERT_P12: ${{ inputs.cert-p12 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
      run: |
        set -euo pipefail
        if [ -z "${CERT_P12}" ]; then
          echo "signing secrets absent — shipping unsigned"
          echo "identity=" >> "$GITHUB_OUTPUT"
          echo "keychain=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(uuidgen)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 900 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
          -P "$CERT_PASSWORD" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S "apple-tool:,apple:" \
          -s -k "$keychain_password" "$keychain" >/dev/null
        security list-keychains -d user -s "$keychain" login.keychain

        identity=$(security find-identity -v -p codesigning "$keychain" \
          | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
        # Caught here rather than by codesign's own "no identity found",
        # so the log says which half failed: the .p12 imported, but holds
        # no Developer ID Application identity.
        if [ -z "$identity" ]; then
          echo "::error::no Developer ID Application identity in the imported certificate"
          exit 1
        fi
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
