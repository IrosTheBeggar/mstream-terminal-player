<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mstream-player · web demo</title>
    <!-- rustc emits bulk-memory ops by default now; trunk's wasm-opt
         validates with them off unless told, and fails the release build.
         (data-wasm-opt-params needs trunk >= 0.21.)
         Built for speed rather than size, measured (performance audit
         #126): opt-level "z" takes 12% off the gzipped bundle but makes a
         visualizer frame ~65% slower, and fat LTO or wasm-opt -Oz save
         about 1.5%. The size win that costs nothing is build.rs giving the
         browser the English table alone. -->
    <link
      data-trunk
      rel="rust"
      data-bin="mstream-player"
      data-wasm-opt="2"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
    />
    <script>
      // Spike scaffolding: collect boot-time failures somewhere a headless
      // probe can read them, since a hidden pane surfaces no console.
      window.__bootErrors = [];
      window.addEventListener("error", function (e) {
        window.__bootErrors.push("error: " + (e.message || String(e.error)));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__bootErrors.push("rejection: " + String(e.reason));
      });
    </script>
    <script>
      // The shell's loop takes the next animation frame whenever something
      // is waiting to be seen (src/web/mod.rs), and browsers stop
      // delivering frames to hidden pages — an embedded or backgrounded
      // demo would sit unpainted until first shown, and a frame asked for
      // just before the tab was hidden would hold the loop, and the next
      // track, until the tab came back. While hidden, substitute a slow
      // timer (browsers throttle it to ~1Hz, which is plenty), and move a
      // frame still waiting when the page hides onto one; hand back to
      // real frames the moment the page is visible. (Nothing here cancels
      // a frame, so a moved one needs no forwarding address.)
      (function () {
        const native = window.requestAnimationFrame.bind(window);
        const cancel = window.cancelAnimationFrame.bind(window);
        const standIn = function (cb) {
          return setTimeout(function () { cb(performance.now()); }, 250);
        };
        const waiting = new Map();
        window.requestAnimationFrame = function (cb) {
          if (document.visibilityState === "hidden") return standIn(cb);
          const id = native(function (t) {
            waiting.delete(id);
            cb(t);
          });
          waiting.set(id, cb);
          return id;
        };
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "hidden") return;
          waiting.forEach(function (cb, id) {
            cancel(id);
            standIn(cb);
          });
          waiting.clear();
        });
      })();
    </script>
    <script>
      // No focus dance here: the shell listens for keys on the document
      // itself (see src/web/mod.rs), so no element needs focus for the
      // keyboard to work.

      // The browser has its own ideas about these keys — Space and the
      // arrows scroll, "/" and "'" open Firefox's quick-find, Tab walks
      // focus off the terminal and takes the keyboard with it. ratzilla
      // deliberately doesn't preventDefault, so the page has to. Modified
      // combinations pass through untouched: Ctrl+R is still reload, Ctrl+C
      // is still copy.
      (function () {
        const claimed = new Set([
          " ", "Tab", "Backspace", "/", "'",
          "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
          "PageUp", "PageDown", "Home", "End",
        ]);
        document.addEventListener(
          "keydown",
          function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (claimed.has(e.key)) e.preventDefault();
          },
          { capture: true }
        );
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #101014;
        /* The grid is sized to the window; a one-pixel overhang otherwise
           grows scrollbars, and Space/arrows would bounce the page. */
        overflow: hidden;
        height: 100%;
      }
      body {
        font-family: "Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace;
        font-size: 16px;
        /* It's an application, not a document: no I-beam, no drag-select
           highlighting, and no focus ring around the whole terminal (the
           grid holds focus permanently by design). */
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        /* The terminal is drawn on a WebGL canvas (src/web/mod.rs), sized
           here rather than by the renderer so a resize reaches it; block,
           or the inline baseline gap grows a scrollbar. Its height is the
           small viewport's where the browser knows one: a phone's 100vh is
           the page with the toolbar hidden, which leaves the transport and
           the status line under the toolbar whenever it shows. svh is the
           height with the toolbar showing, and it holds still while the
           toolbar moves (dvh would not), so the canvas never changes size
           without the resize event the shell redraws on. */
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100svh;
      }
      pre {
        /* Where WebGL2 is missing, the terminal falls back to the DOM grid,
           whose rows are <pre> elements. The browser default gives
           each a 1em vertical margin and its own idea of a monospace font —
           the margins alone once pushed the bottom three rows 559px past
           the fold. Zero margin, and the same font the cell probe measures,
           or rows and measurements disagree. */
        margin: 0;
        font-family: inherit;
        font-size: inherit;
      }
      [tabindex]:focus {
        outline: none;
      }
    </style>
  </head>
  <body></body>
</html>
