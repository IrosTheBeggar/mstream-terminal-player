  off_pitch_1: "Tritt dem Discovery-Netzwerk bei, um Musikempfehlungen aus den Bibliotheken anderer zu bekommen: das Entdecken-Panel des Players erhält einen Bereich \"Aus dem Netzwerk\", und dein Server erscheint im Katalog, den andere Betreiber durchstöbern."
  off_shared: "WAS GETEILT WIRD"
  off_pitch_2a: "Ein Snapshot deiner Bibliothek nur aus Metadaten — Künstler, Titel, Dauer, Track-IDs und akustische \"Klang-Fingerabdrücke\". "
