  off_pitch_2c: " Name und Beschreibung deines Servers sind für alle im Netzwerk sichtbar, und standardmäßig geht der Snapshot ins öffentliche Community-Netzwerk."
  off_pitch_3: "Das Einschalten aktiviert auch die Sammlung von Music-Discovery-Daten (die Analyse nach dem Scan, die die Embeddings baut), falls sie noch aus ist. Du kannst jederzeit austreten; gesammelte Daten bleiben lokal, bis du wieder beitrittst."
