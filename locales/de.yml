  setting_storage_title: "Speicherlimit für Peer-Snapshots"
  setting_storage_label: "MAX. SPEICHER (MB) · 10–100000"
  setting_storage_help: "Wie viel Platz geladene Peer-Snapshots insgesamt belegen dürfen. Gilt sofort für den nächsten Download — liegt das Limit unter der aktuellen Nutzung, stoppen neue Downloads, gelöscht wird nie; Snapshots in der Liste entfernen schafft Platz."
  setting_retention_title: "Offline-Server vergessen"
  setting_retention_label: "TAGE STILLE · 0 = nie"
  setting_retention_help: "Ein Server, der sich so viele Tage nicht gemeldet hat, verschwindet aus der Liste — und taucht wieder auf, sobald er online ist. Server, deren Snapshot du geladen hast, werden nie vergessen; erst den Snapshot entfernen."
  setting_autofetch_title: "Server automatisch laden"
  setting_autofetch_label: "GELADEN ZU HALTENDE SERVER · 0–50"
  setting_autofetch_help: "Auto-Fetch hält die Snapshots von bis zu so vielen Servern geladen und wählt die nützlichsten, die unter das Speicherlimit passen. Erhöhen lädt mehr; senken löscht nichts. 0 pausiert automatische Downloads; manuelle gehen weiter."
  setting_rotation_title: "Downloads rotieren"
  setting_rotation_label: "TAGE, BIS EIN DOWNLOAD GETAUSCHT WERDEN DARF · 0 = nie"
  setting_rotation_help: "Ist der Speicher voll, darf ein Snapshot, der länger als so viele Tage liegt, gegen einen noch fehlenden Server getauscht werden — höchstens einer pro Stunde — damit die Vorschläge frisch bleiben. Immer nur ein Tausch; angepinnte Downloads bleiben unberührt."
  setting_memory_title: "Sidecar-Speichergrenze"
  setting_memory_label: "MAX. ARBEITSSPEICHER (MB) · 0 = aus"
  setting_memory_help: "Wächst der Speicher des p2p-sidecar darüber hinaus, startet der Watchdog ihn automatisch neu — das Mesh knüpft sich binnen einer Minute neu, Downloads sind nicht betroffen. Gilt ab der nächsten Prüfung."
