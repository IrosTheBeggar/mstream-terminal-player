  setting_rotation_help: "Con el espacio lleno, una instantánea guardada más de tantos días puede cambiarse — una por hora como mucho — por un servidor que aún no tienes, para que las sugerencias sigan frescas. Solo intercambios; las descargas fijadas no se tocan."
