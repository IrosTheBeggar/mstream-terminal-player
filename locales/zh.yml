  off_pitch_2a: "仅含元数据的音乐库快照 — 艺术家、标题、时长、曲目 ID 和音频“声音指纹”嵌入。 "
  off_pitch_2b: "绝不包含音频文件。"
  off_pitch_2c: " 你的服务器名称和描述对网络中的所有人可见，默认情况下快照会发布到公共社区网络。"
  off_pitch_3: "开启时，如果音乐发现数据收集（扫描后构建嵌入的分析）尚未开启，也会一并开启。可随时离开；已收集的数据会保留在本地，直到你重新加入。"
