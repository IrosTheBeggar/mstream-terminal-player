  setting_storage_help: "Ile dysku mogą łącznie zająć pobrane migawki peerów. Działa od razu przy następnym pobraniu — obniżenie poniżej obecnego użycia blokuje nowe pobrania, ale nigdy niczego nie usuwa; usuń migawki z listy, by zwolnić miejsce."
  setting_retention_title: "Zapominaj serwery offline"
  setting_retention_label: "DNI CISZY · 0 = nigdy"
  setting_retention_help: "Serwer, który nie ogłosił się przez tyle dni, znika z listy — i wraca, gdy tylko znów będzie online. Serwery, których migawkę trzymasz, nigdy nie są zapominane; najpierw usuń migawkę."
  setting_autofetch_title: "Serwery pobierane automatycznie"
  setting_autofetch_label: "ILE SERWERÓW TRZYMAĆ POBRANYCH · 0–50"
  setting_autofetch_help: "Auto-pobieranie trzyma migawki najwyżej tylu serwerów, wybierając najbardziej przydatne, które mieszczą się w limicie miejsca. Podniesienie pobiera więcej; obniżenie niczego nie usuwa. 0 wstrzymuje automatyczne pobrania; ręczne nadal działają."
  setting_rotation_title: "Rotacja pobrań"
  setting_rotation_label: "DNI, ZANIM POBRANIE MOŻNA WYMIENIĆ · 0 = nigdy"
  setting_rotation_help: "Gdy miejsce się skończy, migawka trzymana dłużej niż tyle dni może zostać wymieniona — najwyżej jedna na godzinę — na serwer, którego jeszcze nie masz, by podpowiedzi były świeże. Zawsze tylko wymiana; przypiętych pobrań nic nie rusza."
  setting_memory_title: "Limit pamięci sidecara"
  setting_memory_label: "MAKS. PAMIĘĆ REZYDENTNA (MB) · 0 = wyłączone"
  setting_memory_help: "Jeśli pamięć p2p-sidecara przekroczy tę wartość, watchdog restartuje go automatycznie — siatka odbudowuje się w ciągu minuty, a pobrania nie cierpią. Działa od następnej kontroli."
  setting_save: "Zapisz ▸"
  setting_invalid: "wpisz liczbę całkowitą od %{min} do %{max}"
  block_title: "Zablokować %{name}?"
  block_1: "Jego ogłoszenia będą odtąd ignorowane, a jego migawka, jeśli trzymana, zostanie usunięta."
  block_2: "u odblokuje go później; wróci przy następnym ogłoszeniu."
  block_keep: "◂ Zostaw"
  block_confirm: "Zablokuj"
  leave_title: "Opuścić sieć odkrywania?"
  leave_1: "Twój serwer przestaje się ogłaszać i pobierać migawki."
  leave_2: "Lokalne odkrywanie działa dalej, a pobrane dane peerów zostają, dopóki ich nie usuniesz."
  leave_stay: "◂ Zostań"
  leave_confirm: "Opuść"
  blocked_title: "Zablokowane serwery — ogłoszenia ignorowane, migawki nigdy niepobierane"
  blocked_empty: "(nic nie zablokowano)"
  blocked_unblock: "Enter odblokowuje"
  off_join: "Dołącz do sieci odkrywania"
  off_requests: "Pozwól innym serwerom wysyłać mi prośby o federację"
  off_requests_hint: "Zaproszenia do współdzielenia bibliotek; nic nie jest udostępniane, dopóki się nie zgodzisz. Włącza federację."
  off_pitch_1: "Dołącz do sieci odkrywania, by dostawać polecenia muzyki z bibliotek innych osób: panel Odkrywaj w odtwarzaczu zyskuje sekcję \"Z sieci\", a twój serwer pojawia się w katalogu, który przeglądają inni operatorzy."
  off_shared: "CO JEST UDOSTĘPNIANE"
  off_pitch_2a: "Migawka twojej biblioteki złożona z samych metadanych — wykonawca, tytuł, długość, ID utworów i \"odciski dźwięku\". "
  off_pitch_2b: "Nigdy pliki audio."
  off_pitch_2c: " Nazwa i opis twojego serwera są widoczne dla wszystkich w sieci, a domyślnie migawka trafia do publicznej sieci społeczności."
  off_pitch_3: "Włączenie uruchamia też zbieranie danych odkrywania muzyki (analizę po skanie, która buduje embeddingi), jeśli było wyłączone. Możesz wyjść w każdej chwili; zebrane dane zostają lokalnie, dopóki nie wrócisz."
