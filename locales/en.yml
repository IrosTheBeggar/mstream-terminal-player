  setting_retention_title: "Forget offline servers"
  setting_retention_label: "DAYS OF SILENCE · 0 = never"
  setting_retention_help: "A server that hasn't announced itself in this many days is dropped from the list — it reappears the moment it comes back online. Servers whose snapshot you hold are never forgotten; remove the snapshot first."
  setting_autofetch_title: "Auto-download servers"
  setting_autofetch_label: "SERVERS TO KEEP DOWNLOADED · 0–50"
  setting_autofetch_help: "Auto-fetch keeps up to this many servers' snapshots downloaded, picking the most useful ones it can hear that fit under the storage cap. Raising it downloads more; lowering it deletes nothing. 0 pauses automatic downloads; downloading by hand still works."
  setting_rotation_title: "Rotate downloads"
  setting_rotation_label: "DAYS BEFORE A DOWNLOAD MAY BE SWAPPED · 0 = never"
  setting_rotation_help: "Once the shelf is full, a snapshot held longer than this may be swapped — one per hour at most — for a server you don't have yet, so network suggestions stay fresh. Only ever a swap; pinned downloads are never touched."
  setting_memory_title: "Sidecar memory ceiling"
  setting_memory_label: "MAX RESIDENT MEMORY (MB) · 0 = off"
  setting_memory_help: "If the p2p-sidecar's memory grows past this, the watchdog restarts it automatically — the mesh reweaves within a minute and downloads are unaffected. Applies from the next health check."
