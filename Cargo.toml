[package]
name = "mstream-player"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal player and headless server-audio engine for mStream"
repository = "https://github.com/IrosTheBeggar/mstream-terminal-player"

# Two targets, one crate. The wasm32 build is the browser demo (see src/web):
# the same App and drawing code rendered by ratzilla, with the OS-bound layers
# — audio device, threads, sockets, filesystem — either stubbed or compiled
# out. Everything in plain [dependencies] must build for both.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
toml = "1.1.4"
# Shared: on wasm this is the fetch backend (its TLS/socket internals are
# target-gated inside reqwest itself), which is what makes api::Client's
# async core one implementation for both builds.
reqwest = "0.13.4"
# The Url type api::urls builds with. On native this is the same crate
# reqwest re-exports (cargo unifies the 2.x line), so the two spellings are
# one type where they meet.
url = "2"
# default-features = false drops the crossterm backend, which has no wasm
# build; the native block below turns it back on. "std" must be named
# explicitly here — the default set only implies it through crossterm, and
# without it ratatui-core goes no-std and expects the app to provide a
# critical-section implementation, which surfaces as unresolvable `env`
# imports in the .wasm.
ratatui = { version = "0.30.2", default-features = false, features = [
    "std",
    "all-widgets",
    "layout-cache",
    "macros",
    "underline-color",
] }
# Decodes cover art, nothing else. jpeg and png are what mStream's art cache
# actually holds; the default features would compile every codec the crate
# knows plus rayon, for images this player never meets. Shared: both decoders
# are pure Rust, and tui::art is part of the drawing path the wasm build keeps.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
# Album art at the terminal's own resolution, where the terminal has one:
# kitty, sixel or iTerm2. Native only, and for two reasons — the wasm build
# draws through ratzilla's DOM backend, where a sixel escape sequence is
# just bytes in a <div>, and the crate's rustix dependency is gated
# `cfg(not(windows))`, which wasm32-unknown-unknown satisfies.
#
# default-features = false is load-bearing, not tidiness. The defaults are
# ["image-defaults", "crossterm", "chafa-dyn"]: chafa-dyn probes pkg-config
# for the libchafa C library, which under Cross.toml is a Docker-image
# problem in five triples at once, and image-defaults turns image's default
# features back on, undoing the jpeg+png trim above and pulling every
# codec. What the crate needs from image (png) it asks for itself. rayon
# arrives regardless — icy_sixel quantises through quantette, which brings
# it — so the trim's win is the codec and C-library weight, not rayon.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rodio = { version = "0.22", features = ["symphonia-all"] }
tiny_http = "0.12"
# Held at 0.5 on purpose: rodio 0.22 decodes through symphonia 0.5.x, and a
# direct 0.6 dep would compile a second symphonia tree whose format support
# differs from what playback actually uses. Bump together with rodio.
# (Checked 2026-07-31: symphonia 0.6.0 still has no opus decoder, so the
# transcode codec=mp3/aac rule from PLAN.md finding #14 stands either way.)
symphonia = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive", "env"] }
stream-download = "0.24.2"
# "time" is for the open() timeout in engine::http — the runtime already ran
# with enable_all(), the timer just wasn't compiled in (PLAN.md finding #69).
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# platform-verifier: trust what the operating system trusts for the relay's
# TLS, not just the compiled-in Mozilla bundle — corporate networks put a
# TLS-inspecting proxy in front of :443 and re-sign with a CA that only the
# OS keychain knows (the tunnel research round).
iroh = { version = "1", features = ["platform-verifier"] }
# The optional debug log (MSTREAM_LOG): a fmt subscriber writing to a file,
# never the terminal. env-filter so RUST_LOG chooses what third-party crates
# (iroh's relay and holepunch narration above all) get to say.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The player's own voice in the same stream as its dependencies': the
# engine's flight-recorder lines are emitted as tracing events too, so the
# in-memory ring holds the story of a session at the default level rather
# than waiting for someone to turn iroh's chatter up.
tracing = "0.1"
iroh-tickets = "1"
# 0.22 rather than 0.23: reqwest, iroh, portmapper and tokio-websockets are
# all on 0.22.1, and pinning a major of our own put two copies of base64 in
# the tree for one decode call (PLAN.md finding #70).
base64 = "0.22"
mdns-sd = "0.20.3"
# The setup wizard's QR code, drawn as unicode half-blocks — no image
# pipeline, just text the terminal already knows how to show.
qrcode = { version = "0.14", default-features = false }

# The setup wizard's native folder picker. Split by backend on purpose
# (the picker spike, mStream-side, 2026-08-21): rfd's Linux portal backend
# links libwayland-client into NEEDED — fatal for a binary that must load
# on headless boxes — and its gtk3 backend links GTK, which is a
# Docker-image problem in five triples at once (the chafa-dyn lesson
# above). So Linux talks to the XDG portal directly through ashpd, which
# with default features off is pure Rust over D-Bus: nothing linked,
# nothing to install at build time, and a clean 1ms failure with no
# session bus (the wizard falls back to its server-side browser). macOS
# and Windows get rfd's native NSOpenPanel / IFileOpenDialog, which link
# only system frameworks.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.15", default-features = false }

# NSOpenPanel from a terminal-launched process opens BEHIND every window
# and without key focus unless the process activates itself first — the
# wizard then looks hung while it blocks on an invisible dialog (observed
# on the first live click-through). Both crates are already in rfd's own
# tree; making them direct deps costs nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.1"
# Closure — the shell's own document-level keydown listener (see
# src/web/mod.rs for why ratzilla's on_key_event can't be trusted with it).
wasm-bindgen = "0.2"
# spawn_local — how the web api worker runs the async client without a
# runtime: the browser's event loop is the executor.
wasm-bindgen-futures = "0.4"
# The playback path: an <audio> element for sound, an AudioContext with
# per-channel analysers for the visualizer tap. See src/web/audio.rs for
# why this and not cpal or an AudioWorklet.
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "BaseAudioContext",
    "ChannelSplitterNode",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "Location",
    "MediaElementAudioSourceNode",
    "MediaError",
    "Window",
] }
# std::time::Instant panics on wasm32-unknown-unknown; this is the same API
# over performance.now(). See src/clock.rs.
web-time = "1"
console_error_panic_hook = "0.1"
# Without "js" the browser build has no entropy source and every shuffle
# deals the same hand.
fastrand = { version = "2", features = ["js"] }

[profile.release]
# One distributed binary, built rarely: spend the compile time on it. Thin
# LTO and a single codegen unit trim a dependency tree this size (iroh,
# reqwest, symphonia) by roughly a fifth; strip drops the debug weight.
strip = true
lto = "thin"
codegen-units = 1

# cargo-deb wraps the already-cross-built binaries in the release workflow
# (--no-build --no-strip --target <triple>); nothing here compiles anything.
# The dependency alternative below is the noble rename of libasound2 — the
# whole point of shipping a .deb is that ALSA arrives with it.
[package.metadata.deb]
maintainer = "Paul Sori <paul@mstream.io>"
copyright = "Paul Sori"
extended-description = """
Browse, queue and play music from an mStream server in the terminal, or
run the same binary headless as mStream's server-audio jukebox engine."""
section = "sound"
priority = "optional"
depends = "libasound2t64 | libasound2"
assets = [
    ["target/release/mstream-player", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mstream-player/README.md", "644"],
]

# The same wrap for rpm; alsa-lib is libasound's spelling over there. The
# auto-req scanner is off because the packaging host is not the target.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mstream-player", dest = "/usr/bin/mstream-player", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mstream-player/README.md", mode = "644", doc = true },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
