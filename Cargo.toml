[package]
name = "mstream-player"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal player and headless server-audio engine for mStream"
repository = "https://github.com/IrosTheBeggar/mstream-terminal-player"

[dependencies]
rodio = { version = "0.22", features = ["symphonia-all"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Held at 0.5 on purpose: rodio 0.22 decodes through symphonia 0.5.x, and a
# direct 0.6 dep would compile a second symphonia tree whose format support
# differs from what playback actually uses. Bump together with rodio.
# (Checked 2026-07-31: symphonia 0.6.0 still has no opus decoder, so the
# transcode codec=mp3/aac rule from PLAN.md finding #14 stands either way.)
symphonia = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
stream-download = "0.24.2"
# "time" is for the open() timeout in engine::http — the runtime already ran
# with enable_all(), the timer just wasn't compiled in (PLAN.md finding #69).
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = "0.13.4"
ratatui = "0.30.2"
# Decodes cover art, nothing else. jpeg and png are what mStream's art cache
# actually holds; the default features would compile every codec the crate
# knows plus rayon, for images this player never meets.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iroh = "1"
iroh-tickets = "1"
# 0.22 rather than 0.23: reqwest, iroh, portmapper and tokio-websockets are
# all on 0.22.1, and pinning a major of our own put two copies of base64 in
# the tree for one decode call (PLAN.md finding #70).
base64 = "0.22"
mdns-sd = "0.20.3"
toml = "1.1.4"

[profile.release]
# One distributed binary, built rarely: spend the compile time on it. Thin
# LTO and a single codegen unit trim a dependency tree this size (iroh,
# reqwest, symphonia) by roughly a fifth; strip drops the debug weight.
strip = true
lto = "thin"
codegen-units = 1
