[package]
name = "mstream-player"
version = "0.8.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal player and headless server-audio engine for mStream"
repository = "https://github.com/IrosTheBeggar/mstream-terminal-player"

# Two targets, one crate. The wasm32 build is the browser demo (see src/web):
# the same App and drawing code rendered by ratzilla, with the OS-bound layers
# — audio device, threads, sockets, filesystem — either stubbed or compiled
# out. Everything in plain [dependencies] must build for both.

[dependencies]
# i18n: compile-time-embedded YAML locales (locales/*.yml), t!() with
# interpolation and per-call locale. Every target: the shared App's Auto
# DJ notes are keys, and the browser build shows them too (in English
# until the web shell sets a locale).
# 4.x, not 3.x: the 3.x macro emitted one statement per translation into a
# single closure — ten locales × 1,700 keys = 17,000 statements in one
# function — and LLVM's time and memory on that grew past what the release
# runner has (v0.8.0's web-bundle job was killed at 7 GB; the same crate at
# 0.7.0's 1,000 keys built in a minute). 4.x packs each locale into one
# string and decodes it at runtime, so the table is data again: 58 s and
# under 1 GB for the wasm release, measured on the 0.8.0 tree.
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
# The Add-torrent room's release-name parser: a ladder of the record's
# own patterns (scene grammar, "Artist - Album (1999)", dot names). Already
# in the tree through tracing-subscriber's env-filter; shared because the
# parser is pure string work.
regex = "1"
# Display width for the GUI's cell budgets: a CJK label is two cells a
# character, and ratatui measures the same way.
unicode-width = "0.2"
toml = "1.1.4"
# Shared: on wasm this is the fetch backend (its TLS/socket internals are
# target-gated inside reqwest itself), which is what makes api::Client's
# async core one implementation for both builds.
reqwest = "0.13.4"
# The Url type api::urls builds with. On native this is the same crate
# reqwest re-exports (cargo unifies the 2.x line), so the two spellings are
# one type where they meet.
url = "2"
# default-features = false drops the crossterm backend, which has no wasm
# build; the native block below turns it back on. "std" must be named
# explicitly here — the default set only implies it through crossterm, and
# without it ratatui-core goes no-std and expects the app to provide a
# critical-section implementation, which surfaces as unresolvable `env`
# imports in the .wasm.
ratatui = { version = "0.30.2", default-features = false, features = [
    "std",
    "all-widgets",
    "layout-cache",
    "macros",
    "underline-color",
] }
# Decodes cover art, nothing else. jpeg and png are what mStream's art cache
# actually holds; the default features would compile every codec the crate
# knows plus rayon, for images this player never meets. Shared: both decoders
# are pure Rust, and tui::art is part of the drawing path the wasm build keeps.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
# Album art at the terminal's own resolution, where the terminal has one:
# kitty, sixel or iTerm2. Native only, and for two reasons — the wasm build
# draws through ratzilla's DOM backend, where a sixel escape sequence is
# just bytes in a <div>, and the crate's rustix dependency is gated
# `cfg(not(windows))`, which wasm32-unknown-unknown satisfies.
#
# default-features = false is load-bearing, not tidiness. The defaults are
# ["image-defaults", "crossterm", "chafa-dyn"]: chafa-dyn probes pkg-config
# for the libchafa C library, which under Cross.toml is a Docker-image
# problem in five triples at once, and image-defaults turns image's default
# features back on, undoing the jpeg+png trim above and pulling every
# codec. What the crate needs from image (png) it asks for itself. rayon
# arrives regardless — icy_sixel quantises through quantette, which brings
# it — so the trim's win is the codec and C-library weight, not rayon.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# sys-locale answers "what language is this machine?" for the wizard.
# Native-only — the wasm build has no wizard (rust-i18n itself is a plain
# dependency: the shared App's notes go through t!() on every target).
sys-locale = "0.3"
rodio = { version = "0.22", features = ["symphonia-all"] }
tiny_http = "0.12"
# Held at 0.5 on purpose: rodio 0.22 decodes through symphonia 0.5.x, and a
# direct 0.6 dep would compile a second symphonia tree whose format support
# differs from what playback actually uses. Bump together with rodio.
# (Checked 2026-07-31: symphonia 0.6.0 still has no opus decoder, so the
# transcode codec=mp3/aac rule from PLAN.md finding #14 stands either way.)
symphonia = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive", "env"] }
# The launcher's one-desktop-player rule: an advisory lock the player holds
# for its lifetime (src/instance.rs). flock on unix, LockFileEx on Windows —
# the same crate the mStream tray launcher tries it with.
fslock = "0.2"
stream-download = "0.24.2"
# "time" is for the open() timeout in engine::http — the runtime already ran
# with enable_all(), the timer just wasn't compiled in (PLAN.md finding #69).
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The tunnel client shared with the mobile app (and anyone else): dials a
# Quick Connect code or a federation guest ticket and serves the server on
# a loopback port, with a reconnect supervisor and an in-place credential
# swap. By git tag until it is on crates.io. Without its C ABI (no
# `#[no_mangle]` symbols in this binary); with `os-trust`, so the relay's
# TLS is checked against what the operating system trusts, not just the
# compiled-in Mozilla bundle — corporate networks put a TLS-inspecting proxy
# in front of :443 and re-sign with a CA that only the OS keychain knows
# (the tunnel research round).
mstream-iroh-tunnel = { git = "https://github.com/IrosTheBeggar/mstream-iroh-tunnel", tag = "v0.2.0", default-features = false, features = ["os-trust"] }
# The optional debug log (MSTREAM_LOG): a fmt subscriber writing to a file,
# never the terminal. env-filter so RUST_LOG chooses what third-party crates
# (iroh's relay and holepunch narration above all) get to say.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The player's own voice in the same stream as its dependencies': the
# engine's flight-recorder lines are emitted as tracing events too, so the
# in-memory ring holds the story of a session at the default level rather
# than waiting for someone to turn iroh's chatter up.
tracing = "0.1"
# 0.22 rather than 0.23: reqwest, iroh, portmapper and tokio-websockets are
# all on 0.22.1, and pinning a major of our own put two copies of base64 in
# the tree for one decode call (PLAN.md finding #70).
base64 = "0.22"
mdns-sd = "0.20.3"
# The setup wizard's QR code, drawn as unicode half-blocks — no image
# pipeline, just text the terminal already knows how to show.
qrcode = { version = "0.14", default-features = false }
terminal-colorsaurus = "1.0.3"
tui-input = "0.15.4"
# The window visualizer's renderer (src/shader/render.rs; PLAN.md, Phase
# 11): the mobile app's shader presets, compiled by the naga inside wgpu to
# Metal, HLSL, SPIR-V or GLSL. `glsl` is what reads the presets, `wgsl` the
# one vertex shader of our own — and 30.0.1's GLSL frontend does not build
# without it. default-features = false only to leave out the browser
# backends (`webgpu`), which this half of the build never runs. On Linux
# the backend libraries (libvulkan, libEGL, libGL) are opened at run time,
# never linked; CI's NEEDED guard holds the binary to that.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "gles",
    "wgsl",
    "glsl",
] }
# The visualizer's window (src/viz_window; PLAN.md, Phase 11.1): winit for
# the window and its keys, on the same wgpu. Its default features are what
# keeps the Linux binary loadable on a headless box — `wayland-dlopen` and
# `x11-dl` open their libraries at run time — and CI's NEEDED guard holds
# the build to that.
winit = "0.30"
# The window's controls (src/viz_window/controls.rs): the preset arrows,
# the preset dropdown and the tuning panel, drawn by egui over the preset on
# the same wgpu device and fed the same winit events. 0.36 is the line on
# wgpu 30 and winit 0.30.13; it wants rustc 1.95. default-features = false
# on all three is load-bearing: egui-wgpu's defaults turn wgpu's defaults
# back on (the browser backends the line above leaves out), and
# egui-winit's bring a clipboard (arboard, smithay-clipboard) and a browser
# launcher the window never uses; egui's own `default_fonts` would embed four
# faces where the controls draw with two (below). A CJK face is borrowed
# from the system at run time, for Japanese and Chinese.
egui = { version = "0.36", default-features = false }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
# egui's two text faces, Ubuntu Light and Hack, named directly so its two
# emoji faces — 0.7 MB the controls never draw — stay out of the binary.
# Versioned with egui.
epaint_default_fonts = "0.36"
# Already in the tree as egui's font reader, and named here for one call:
# a borrowed system face is checked the way egui will read it, because
# egui panics on a face it cannot parse. Versioned with egui's (epaint).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The GUI's own window (src/gui/window/; the window-mode spike): a
# ratatui backend that draws the cell buffer onto a wgpu surface, so the
# same `render` that fills a terminal fills a native window. It is on the
# wgpu and ratatui-core lines above and draws onto any surface target, the
# winit window included, without depending on winit itself; it shapes text
# with rustybuzz over faces it is handed, so no system font stack
# (font-kit, freetype, fontconfig) comes with it. default-features = false
# leaves out `ahash`, which would bring ahash's compile-time-rng
# (const-random, tiny-keccak) and flip the ahash egui shares onto it, and
# `png`, which decodes colour bitmap glyphs from emoji faces the window is
# never handed.
ratatui-wgpu = { version = "0.6", default-features = false }

# The setup wizard's native folder picker. Split by backend on purpose
# (the picker spike, mStream-side, 2026-08-21): rfd's Linux portal backend
# links libwayland-client into NEEDED — fatal for a binary that must load
# on headless boxes — and its gtk3 backend links GTK, which is a
# Docker-image problem in five triples at once (the chafa-dyn lesson
# above). So Linux talks to the XDG portal directly through ashpd, which
# with default features off is pure Rust over D-Bus: nothing linked,
# nothing to install at build time, and a clean 1ms failure with no
# session bus (the wizard falls back to its server-side browser). macOS
# and Windows get rfd's native NSOpenPanel / IFileOpenDialog, which link
# only system frameworks.
# Windows only: IFileOpenDialog from a console app is standard and fronts
# fine. macOS deliberately does NOT use rfd — an NSOpenPanel opened by a
# terminal-launched process stays behind every window without key focus
# (live-tested through activation policies and activateIgnoringOtherApps;
# it never fronted) — the mac picker shells out to osascript instead,
# which runs the chooser in its own app context.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.1"
# Closure — the shell's own document-level keydown listener (see
# src/web/mod.rs for why ratzilla's on_key_event can't be trusted with it).
wasm-bindgen = "0.2"
# spawn_local — how the web api worker runs the async client without a
# runtime: the browser's event loop is the executor.
wasm-bindgen-futures = "0.4"
# The playback path: an <audio> element for sound, an AudioContext with
# per-channel analysers for the visualizer tap. See src/web/audio.rs for
# why this and not cpal or an AudioWorklet.
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "BaseAudioContext",
    "ChannelSplitterNode",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "Location",
    "MediaElementAudioSourceNode",
    "MediaError",
    "Window",
] }
# std::time::Instant panics on wasm32-unknown-unknown; this is the same API
# over performance.now(). See src/clock.rs.
web-time = "1"
console_error_panic_hook = "0.1"
# Without "js" the browser build has no entropy source and every shuffle
# deals the same hand.
fastrand = { version = "2", features = ["js"] }

[profile.release]
# One distributed binary, built rarely: spend the compile time on it. Thin
# LTO and a single codegen unit trim a dependency tree this size (iroh,
# reqwest, symphonia) by roughly a fifth; strip drops the debug weight.
strip = true
lto = "thin"
codegen-units = 1

# cargo-deb wraps the already-cross-built binaries in the release workflow
# (--no-build --no-strip --target <triple>); nothing here compiles anything.
# The dependency alternative below is the noble rename of libasound2 — the
# whole point of shipping a .deb is that ALSA arrives with it.
[package.metadata.deb]
maintainer = "Paul Sori <paul@mstream.io>"
copyright = "Paul Sori"
extended-description = """
Browse, queue and play music from an mStream server in the terminal, or
run the same binary headless as mStream's server-audio jukebox engine."""
section = "sound"
priority = "optional"
depends = "libasound2t64 | libasound2"
assets = [
    ["target/release/mstream-player", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mstream-player/README.md", "644"],
]

# The same wrap for rpm; alsa-lib is libasound's spelling over there. The
# auto-req scanner is off because the packaging host is not the target.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mstream-player", dest = "/usr/bin/mstream-player", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mstream-player/README.md", mode = "644", doc = true },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
alsa-lib = "*"

# The tests' fake mStream endpoint — the server half of the tunnel protocol,
# relay-free — speaks iroh directly; the player itself no longer does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iroh = "1"
iroh-tickets = "1"

[dev-dependencies]
# The locale-completeness test parses locales/*.yml directly.
serde_yaml = "0.9"
# The visualizer presets' compile matrix (src/shader/matrix.rs): every pass
# through naga's GLSL frontend, its validator, and all four backends wgpu
# drives — Metal, HLSL, SPIR-V, desktop GLSL — with no GPU, so CI runs it
# everywhere. The naga wgpu itself uses; they are versioned together.
# `wgsl-in` because 30.0.1's GLSL frontend does not compile without it.
naga = { version = "30", features = ["glsl-in", "wgsl-in", "msl-out", "hlsl-out", "spv-out", "glsl-out"] }

[build-dependencies]
# Windows icon + VersionInfo embedding (build.rs; no-op for other targets).
winresource = "0.1"

# Two crates built from copies in vendor/ rather than from crates.io, each
# for a defect upstream has not shipped a fix for (vendor/*/VENDORED.md says
# exactly what differs). A patch, not a path dependency, so the version
# lines above stay the contract and everything else in the tree that wants
# the same crate — egui-winit wants winit — gets the patched copy too: one
# winit, one ratatui-wgpu. Drop an entry once a release carries its fix.
[patch.crates-io]
# The GUI window's renderer. Vendored unchanged for now, as the place its
# fixes land (surface format, face index, wide-glyph shaping, failed
# presents).
ratatui-wgpu = { path = "vendor/ratatui-wgpu" }
# macOS IME: 0.30.13 drops an ASCII key typed right after an input
# method's commit (Korean `한` then `;` or a digit loses that key) and
# doubles a Space typed with no composition. The fix is rust-windowing/
# winit PR #4478, backported to the 0.30 layout; VENDORED.md has the
# hunks. Japanese and Chinese are untouched by it: their confirm keys
# never leave the input method (the Kotoeri candidate list takes an Enter
# of its own, which is native, not a defect).
winit = { path = "vendor/winit" }
